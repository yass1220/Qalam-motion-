<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>تتبع الطلب | قلم موشن</title>
  <style>
    *{box-sizing:border-box}:root{--panel:#232221;--line:#665445;--gold:#e9c38b;--muted:#bab7b0}
    body{margin:0;background:radial-gradient(circle at 80% 0,#3c3425,#111316 45%);color:#f7efe2;font:16px Tahoma,"Noto Naskh Arabic",Arial,system-ui,sans-serif}
    a{color:inherit;text-decoration:none}.wrap{max-width:860px;margin:auto;padding:28px}
    header{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid rgba(255,225,185,.16);padding-bottom:20px;margin-bottom:28px}.brand{font-weight:800;color:var(--gold);font-size:24px}
    .muted{color:var(--muted);line-height:1.8}.button{background:var(--gold);color:#171411;border:0;padding:13px 18px;border-radius:12px;font-weight:800;cursor:pointer;display:inline-block}.button.secondary{background:#2a2827;color:#fff0d8;border:1px solid var(--line)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}label{display:block;margin:0 0 8px}input{width:100%;padding:14px;border-radius:10px;background:#111316;color:white;border:1px solid #686159;font:inherit;direction:ltr;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.result{display:none}.status{display:inline-block;border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px;background:#25374b;color:#c6dfff}.ltr{direction:ltr;text-align:left}#message{color:#f2cd95;margin-top:12px;line-height:1.7}
    @media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <a class="brand" href="/">قلم موشن</a>
        <p class="muted">تتبع حالة طلبك باستخدام رقم الطلب والبريد الإلكتروني نفسه الذي استعملته عند الدفع.</p>
      </div>
      <a class="button secondary" href="/">العودة للموقع</a>
    </header>

    <section class="panel">
      <div class="grid">
        <div>
          <label for="orderId">رقم الطلب</label>
          <input id="orderId" autocomplete="off" placeholder="مثال: 7b2017cb-...">
        </div>
        <div>
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <button id="check" class="button">تتبع الطلب</button>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
    </section>

    <section id="result" class="panel result">
      <h1>حالة الطلب</h1>
      <p><strong>رقم الطلب:</strong> <span id="r-id" class="ltr"></span></p>
      <p><strong>الباقة:</strong> <span id="r-package"></span></p>
      <p><strong>الدفع:</strong> <span id="r-payment" class="status"></span></p>
      <p><strong>التنفيذ:</strong> <span id="r-fulfillment" class="status"></span></p>
      <p class="muted">إذا كان الطلب مدفوعا ولم تظهر حالته بشكل صحيح، لا تعيد الدفع. تواصل معنا برقم الطلب.</p>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const fulfillment = {
      NEW: 'طلب جديد',
      IN_PROGRESS: 'قيد التنفيذ',
      WAITING_CUSTOMER: 'بانتظار معلومات منك',
      DELIVERED: 'تم التسليم',
      CANCELLED: 'ملغي'
    };
    const payment = {
      PAID: 'مدفوع',
      AWAITING_PAYMENT: 'ينتظر الدفع'
    };
    async function checkOrder() {
      $('message').textContent = 'جار التحقق من الطلب...';
      $('result').style.display = 'none';
      try {
        const response = await fetch('/api/orders/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: $('orderId').value, email: $('email').value })
        });
        const json = await response.json();
        if (!response.ok) throw Error(json.error || 'لم نتمكن من العثور على الطلب');
        $('r-id').textContent = json.id;
        $('r-package').textContent = json.packageId;
        $('r-payment').textContent = payment[json.status] || json.status;
        $('r-fulfillment').textContent = fulfillment[json.fulfillmentStatus] || 'طلب جديد';
        $('result').style.display = 'block';
        $('message').textContent = 'تم العثور على الطلب.';
      } catch (error) {
        $('message').textContent = error.message;
      }
    }

    $('check').addEventListener('click', checkOrder);
    ['orderId', 'email'].forEach(id => {
      $(id).addEventListener('keydown', event => {
        if (event.key === 'Enter') checkOrder();
      });
    });

    const params = new URLSearchParams(location.search);
    const initialOrderId = params.get('orderId') || sessionStorage.getItem('qalam_order_id') || '';
    const initialEmail = sessionStorage.getItem('qalam_order_email') || '';
    if (initialOrderId) $('orderId').value = initialOrderId;
    if (initialEmail) $('email').value = initialEmail;
    if (initialOrderId && initialEmail) checkOrder();
    else if (initialOrderId) $('message').textContent = 'أدخل البريد الإلكتروني الذي استعملته في الدفع لإظهار حالة الطلب.';
  </script>
</body>
</html>
